<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyPath – Profile</title>
<link rel="icon" href="../assets/img/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- MAIN UI (shared look + sidebar + top bar) -->
<link rel="stylesheet" href="../main-ui/style.css">
<script src="../main-ui/script.js"></script>
<!-- THIS PAGE -->
<link rel="stylesheet" href="style.css">
</head>
<body data-active="profile">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="content">
    <header class="topbar" id="topbar"></header>

    <main class="page">
      <div class="page-head">
        <div><h1>My Profile</h1><p>Manage your account and how PyPath looks.</p></div>
      </div>

      <!-- profile header -->
      <div class="card prof-card">
        <div class="prof-top">
          <div class="prof-photo">
            <img class="avatar-img xl" src="../assets/img/avatar.png" alt="" data-ph="Photo">
            <button class="photo-btn" id="photoBtn" type="button" aria-label="Change photo"><span data-icon="edit"></span></button>
          </div>
          <div>
            <h2 id="pName"></h2>
            <p class="sub" id="pEmail"></p>
            <div class="chips" id="pChips"></div>
          </div>
        </div>
        <div class="prof-stats" id="pStats"></div>
      </div>

      <!-- tabs: #profile  #security  #appearance -->
      <div class="pills" id="tabs" role="tablist">
        <a class="pill" href="#profile" data-t="profile">Profile</a>
        <a class="pill" href="#security" data-t="security">Security</a>
        <a class="pill" href="#appearance" data-t="appearance">Appearance</a>
      </div>
      <form class="card form" id="pf" novalidate>
        <div class="fg" id="fields"></div>
        <div class="err" id="formErr"></div>
        <div class="form-actions" id="formActs"></div>
      </form>
    </main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Quick navigation"></nav>
<div class="drawer" id="drawer"></div>
<div class="toasts" id="toasts"></div>
<script src="script.js"></script>
</body>
</html>
